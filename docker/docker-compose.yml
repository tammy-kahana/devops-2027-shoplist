services:
  
    # מסד הנתונים, שומר את המוצרים. רק ה-backend מדבר איתו
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: shoplist
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopuser -d shoplist"]
      interval: 10s
      timeout: 5s
      retries: 5

    # ה-API ב-Flask, קורא וכותב מוצרים במסד postgres
  backend:
    build:
      context: ../app/backend
    environment:
      DB_HOST: postgres
      DB_NAME: shoplist
      DB_USER: shopuser
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

    # שירות הסטטיסטיקה ב-Node.js, מבקש את רשימת המוצרים מה-backend
  stats:
    build:
      context: ../app/stats
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend

    # שרת Nginx: מגיש את האתר לדפדפן ומעביר בקשות API ל-backend ול-stats
  frontend:
    build:
      context: ../app/frontend
      dockerfile: Dockerfile.multistage
    ports:
      - "8080:80"
    depends_on:
      - backend
      - stats

volumes:
  postgres-data:
